<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE8DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>決算書は嘘をつく</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Shippori+Mincho+B1:wght@500;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 紙の質感（ノイズ）と、周辺を暗くするビネット -->
<svg class="paper" aria-hidden="true" width="100%" height="100%">
  <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.18 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-noise)"/>
</svg>
<main id="app" aria-live="polite"></main>
<div id="sheet-root"></div>
<div class="vignette" aria-hidden="true"></div>
<script src="js/story.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
